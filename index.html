<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="keywords" content="ui, clicker, game, online, html5, free">
    <title>KubaUI Mobile</title>
    <link rel="stylesheet" href="style/ui.css">
    <link rel="stylesheet" href="style/static.css">

    <link rel="icon" type="image/x-icon" href="img/cookie.ico">
    <link rel="apple-touch-icon" href="img/ios icon 300x300.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body ontouchstart="">

    <div id="page1" class="hrefPage">
        <div class="topbar" data-title="Example"></div>

        <div class="content">
            <div class="divwidth">
                <input type="text" placeholder="Search" class="fullwidth">
            </div>

            <div class="divwidth">
                <button class="fullwidth">button</button> 
                <button class="fullwidth buttonDisabled">Disabled button</button>
            </div>
            
            <div class="widget">
                <h2>Widget</h2>
                <button onclick="showPage('page2')">widget button</button>
            </div>

            <p>
                p: This is the best mobile user interface, at least in HTML and CSS.
            </p>
        </div>
    </div>

    <div id="page2" class="hrefPage" data-bottombar="show">
        <div class="topbar" data-title="Docs"></div>

        <div class="content">
            <div class="widget">
                <h2>Page</h2>
                <p>in index.html</p>
                <img src="img/page.png" alt="">
                <p style="font-size: 12px;">data-title="Docs" in topbar div is for title in topbar</p>
            </div>

            <div class="widget">
                <h2>Bottom Bar</h2>
                <p>in index.html</p>
                <img src="img/bottombar.png" alt="">
            </div>

            <div class="widget">
                <h2>Go to some page</h2>
                <p>in index.html</p>
                <img src="img/onclick.png" alt="">
                <p style="font-size: 12px;">use onclick="showPage('page2')"</p>
            </div>
        </div>
    </div>

    <div id="page3" class="hrefPage" data-bottombar="show">
        <div class="topbar" data-title="Download"></div>

        <div class="content">
            <p>
                Coming soon!
            </p>
        </div>
    </div>

    <div id="page20" class="hrefPage" data-bottombar="none">
        <div class="topbar" data-title="Settings"></div>

        <div class="content">
            <p>
                without bottombar
            </p>
        </div>
    </div>

    <div class="bottombar">
        <button class="hrefButton" data-page="page1">Home</button>
        <button class="hrefButton" data-page="page2">Docs</button>
        <button class="hrefButton" data-page="page3">Download</button>
    </div>

    <script src="js/scenes.js"></script>
    <script src="js/topbar.js"></script>

</body>
</html>
